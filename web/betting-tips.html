<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betting tips · Pexerearn</title>
<meta name="description" content="Football tips from the Pexerearn team.">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="betting-tips" data-shell="app">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Betting tips</h1>
      <p>Football tips from our team, with the results once the games are played.</p>
    </div>
  </div>
  <div class="zx-banner zx-banner--warning"><svg class="zx-icon" aria-hidden="true"><use href="/img/icons.svg#info"></use></svg><span class="zx-banner__text">Tips are opinions, not guarantees. Never bet money you cannot afford to lose.</span></div>
  <section class="zx-card">
    <div class="zx-section-title"><h2>Upcoming tips</h2></div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Kick-off</th><th scope="col">Match</th><th scope="col">Tip</th><th scope="col">Odds</th></tr></thead>
        <tbody id="upcoming"><tr><td colspan="4" class="zx-td-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
  <section class="zx-card">
    <div class="zx-section-title"><h2>Recent results</h2></div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Kick-off</th><th scope="col">Match</th><th scope="col">Tip</th><th scope="col">Score</th><th scope="col">Result</th></tr></thead>
        <tbody id="results"><tr><td colspan="5" class="zx-td-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
</div>
</main>
</body>
</html>
