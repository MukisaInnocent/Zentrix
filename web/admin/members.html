<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members · Zentrix Staff</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5c63">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="admin-members" data-shell="admin">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Members</h1>
      <p>Search members, see their balances and payments, and freeze an account under review.</p>
    </div>
    <div class="zx-page-head__actions"></div>
  </div>
  <div class="zx-card zx-stack-3">
    <div class="zx-filters">
      <input id="search" class="zx-input" type="search" placeholder="Search username, email or phone" aria-label="Search members">
    </div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Member</th><th scope="col">Phone</th><th scope="col">Country</th><th scope="col">Joined</th><th scope="col">Verified</th><th scope="col">Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="zx-pager"></div>
  </div>
</div>
</main>
</body>
</html>
