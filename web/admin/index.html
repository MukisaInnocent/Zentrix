<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overview · Zentrix Staff</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5c63">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="admin-home" data-shell="admin">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Overview</h1>
      <p>Live view of deposits, withdrawals, member issues and system health.</p>
    </div>
    <div class="zx-page-head__actions"><span id="live" class="zx-live"></span></div>
  </div>
  <div id="banners" class="zx-stack-3"></div>
  <div id="kpis" class="zx-kpis"></div>
  <div class="zx-cols">
    <section class="zx-card">
      <div class="zx-section-title"><h2>Live activity</h2><a class="zx-btn zx-btn--ghost zx-btn--sm" href="/admin/ledger.html">Open ledger</a></div>
      <ul id="feed" class="zx-feed"></ul>
    </section>
    <div class="zx-stack-4">
      <section class="zx-card">
        <div class="zx-section-title"><h2>Balance check</h2><a class="zx-btn zx-btn--ghost zx-btn--sm" href="/admin/balances.html">Details</a></div>
        <div id="balances"></div>
      </section>
      <section class="zx-card">
        <div class="zx-section-title"><h2>System alerts</h2></div>
        <div id="alerts"></div>
      </section>
    </div>
  </div>
</div>
</main>
</body>
</html>
