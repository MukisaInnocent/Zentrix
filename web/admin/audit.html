<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audit log · Zentrix Staff</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e5c63">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="admin-audit" data-shell="admin">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Audit log</h1>
      <p>Every staff action with who, what, before and after, and when. It cannot be edited.</p>
    </div>
    <div class="zx-page-head__actions"></div>
  </div>
  <div class="zx-card zx-stack-3">
    <div class="zx-filters">
      <input id="search" class="zx-input" type="search" placeholder="Filter by action, for example deposit. or withdrawal.paid" aria-label="Filter by action">
    </div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">When</th><th scope="col">Staff</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Reason</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="zx-pager"></div>
  </div>
</div>
</main>
</body>
</html>
