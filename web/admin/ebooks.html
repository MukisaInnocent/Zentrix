<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-books · Pexerearn Staff</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="admin-ebooks" data-shell="admin">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>E-books</h1>
      <p>The books on the members' E-books page, grouped by section. Each book links to its file (a PDF on any https link, for example Google Drive shared with "anyone with the link"). Hidden books stay here but members do not see them.</p>
    </div>
    <div class="zx-page-head__actions"><button id="add-btn" class="zx-btn" type="button">Add an e-book</button></div>
  </div>
  <div class="zx-card zx-stack-3">
    <div class="zx-filters">
      <label class="zx-check"><input id="show-removed" type="checkbox"> Show removed books</label>
    </div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Section</th><th scope="col">Title</th><th scope="col">Pages</th><th scope="col">Link</th><th scope="col">Members see it</th><th scope="col">Order</th><th scope="col">Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="zx-td-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</main>
</body>
</html>
