<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a new password · Pexerearn</title>
<meta name="description" content="Choose a new Pexerearn password.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="reset-password" data-shell="plain">
<div class="zx-auth-layout">
  <div class="zx-auth-panel">
    <div class="zx-auth-card">
      <a href="/" class="zx-brand"><img src="/img/mark.svg" alt=""><span class="zx-wordmark"><span class="zx-wordmark__pexer">Pexer</span><span class="zx-wordmark__earn">earn</span></span></a>
      <h1 data-i18n="reset.title">Choose a new password</h1>
      <p class="zx-lead" data-i18n="reset.lead">Pick something you have not used before. Other devices will be signed out.</p>

      <div id="reset-missing" class="zx-banner zx-banner--warning" hidden role="alert"><svg class="zx-icon" aria-hidden="true"><use href="/img/icons.svg#alert"></use></svg><span class="zx-banner__text"><span data-i18n="reset.missingToken">This page needs the link from your reset email.</span> <a href="/forgot-password.html">Ask for a new link</a></span></div>

      <form id="reset-form" class="zx-form" novalidate>
        <div class="zx-error" data-form-error hidden role="alert"></div>
        <div class="zx-field">
          <label for="reset-password" data-i18n="reset.password">New password</label>
          <input id="reset-password" class="zx-input" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters">
          <span id="reset-password-error" class="zx-error" hidden></span>
        </div>
        <div class="zx-field">
          <label for="reset-confirm" data-i18n="reset.confirm">Repeat the new password</label>
          <input id="reset-confirm" class="zx-input" name="confirm" type="password" autocomplete="new-password" required minlength="6">
          <span id="reset-confirm-error" class="zx-error" hidden></span>
        </div>
        <button class="zx-btn zx-btn--block zx-btn--lg" type="submit" data-i18n="reset.submit">Save new password</button>
      </form>

      <div id="reset-done" class="zx-banner zx-banner--success" hidden role="status"><svg class="zx-icon" aria-hidden="true"><use href="/img/icons.svg#check-circle"></use></svg><span class="zx-banner__text"><span data-i18n="reset.done">Your password is changed. Sign in with the new one.</span> <a href="/login.html">Sign in</a></span></div>
    </div>
  </div>
</div>
</body>
</html>
