<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referrals · Pexerearn</title>
<meta name="description" content="The people you invited, level by level.">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="referrals" data-shell="app">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1 id="ref-title">Referrals</h1>
      <p id="ref-lead"></p>
    </div>
  </div>
  <section id="stats-card" class="zx-card" hidden>
    <div class="zx-section-title"><h2 id="stats-title">Overview</h2></div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Level</th><th scope="col">Total</th><th scope="col">Active</th><th scope="col">Inactive</th><th scope="col">Rewards earned</th></tr></thead>
        <tbody id="stats-body"><tr><td colspan="5" class="zx-td-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
  <section id="list-card" class="zx-card" hidden>
    <div class="zx-section-title"><h2 id="table-title">Usernames</h2></div>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Username</th><th scope="col">Phone number</th><th scope="col">Country</th><th scope="col">Joined</th><th scope="col">Status</th><th scope="col">Reward</th></tr></thead>
        <tbody id="ref-body"><tr><td colspan="6" class="zx-td-empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
</div>
</main>
</body>
</html>
