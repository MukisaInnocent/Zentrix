<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile & Settings · Zentrix</title>
<meta name="description" content="Manage your personal profile, security, and account preferences.">
<meta name="theme-color" content="#0e5c63">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="profile" data-shell="app">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Account Profile &amp; Security</h1>
      <p>Manage your verified credentials, security, and personal preferences.</p>
    </div>
  </div>
  <div class="zx-split">
    <div class="zx-card">
      <div class="zx-card__title"><h2>Personal Information</h2></div>
      <div class="zx-form">
        <div class="zx-field">
          <label for="prof-username">Username</label>
          <input id="prof-username" class="zx-input" readonly value="Loading...">
        </div>
        <div class="zx-field">
          <label for="prof-email">Email Address</label>
          <input id="prof-email" class="zx-input" readonly value="Loading...">
        </div>
        <div class="zx-field">
          <label for="prof-phone">Verified Mobile Phone</label>
          <input id="prof-phone" class="zx-input" readonly value="Loading...">
          <span class="zx-hint">Payouts only go to this number. Contact admin to change.</span>
        </div>
        <div class="zx-field">
          <label for="prof-ref-code">Your Referral Code</label>
          <input id="prof-ref-code" class="zx-input" readonly value="Loading...">
        </div>
      </div>
    </div>
    <div class="zx-card">
      <div class="zx-card__title"><h2>Change Password</h2></div>
      <form id="pw-form" class="zx-form">
        <div id="pw-alert" class="zx-error zx-error--slot" role="alert"></div>
        <div class="zx-field">
          <label for="current-password">Current Password</label>
          <input id="current-password" class="zx-input" name="currentPassword" type="password" required autocomplete="current-password">
        </div>
        <div class="zx-form-row zx-form-row--2">
          <div class="zx-field">
            <label for="new-password">New Password</label>
            <input id="new-password" class="zx-input" name="newPassword" type="password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="zx-field">
            <label for="confirm-password">Confirm New Password</label>
            <input id="confirm-password" class="zx-input" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <button id="pw-submit" class="zx-btn zx-btn--fit" type="submit">Update Password</button>
      </form>
    </div>
  </div>
</div>
</main>
</body>
</html>
