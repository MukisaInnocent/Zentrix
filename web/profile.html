<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="profile">
<main>
<div class="ph"><h1>Profile</h1><p>Manage your personal information.</p></div>
<form id="profile-form" class="card" style="max-width:760px"><h3>Personal information</h3>
  <div class="row2"><div><label for="a">Username</label><input id="a" name="username" readonly></div><div><label for="b">Email address</label><input id="b" name="email" type="email" readonly></div>
  <div><label for="c">Phone</label><input id="c" name="phone" autocomplete="tel"></div><div><label for="d">Referral code</label><input id="d" name="referralCode" readonly></div>
  <div><label for="current-password">Current password (to change password)</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password"></div><div><label for="new-password">New password</label><input id="new-password" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password"></div><div><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password"></div></div>
  <button class="btn full" type="submit" style="width:auto">Update profile</button><p data-api-message role="status" aria-live="polite"></p></form>
</main>
<script src="js/app.js"></script>
</body></html>
