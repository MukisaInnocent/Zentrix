<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile · Zentrix</title>
<meta name="description" content="Your Zentrix account details and security.">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="profile" data-shell="app">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Profile</h1>
    </div>
  </div>
  <div class="zx-split">
    <section class="zx-card">
      <div class="zx-card__title"><h2>Account</h2></div>
      <dl class="zx-kv zx-kv--tight">
        <dt>Username</dt><dd id="prof-username"></dd>
        <dt>Country</dt><dd id="prof-country"></dd>
        <dt>Upline</dt><dd id="prof-upline"></dd>
        <dt>Status</dt><dd id="prof-status"></dd>
      </dl>
    </section>
    <section class="zx-card">
      <div class="zx-card__title"><h2>Security</h2></div>
      <p class="zx-hint">To change your password, email or phone, <a href="/contact.html">contact the admin</a>. After they check it is you, the change opens for 24 hours.</p>
      <ul id="security-list" class="zx-rows"></ul>
    </section>
  </div>
</div>
</main>
</body>
</html>
