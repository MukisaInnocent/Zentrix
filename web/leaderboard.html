<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard · Pexerearn</title>
<meta name="description" content="Members ranked by the people they invited who activated.">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="leaderboard" data-shell="app">
<main id="main">
<div class="zx-page">
  <div class="zx-page-head">
    <div>
      <h1>Leaderboard</h1>
      <p>Members ranked by the people they invited directly who activated their account. The ranking is for fun: it pays no prize.</p>
    </div>
  </div>
  <div class="zx-card zx-stack-3">
    <div class="zx-filters">
      <div id="period-filter" class="zx-seg" role="group" aria-label="Period"></div>
    </div>
    <p id="my-rank" class="zx-hint"></p>
    <div class="zx-table-wrap">
      <table class="zx-table">
        <thead><tr><th scope="col">Rank</th><th scope="col">Username</th><th scope="col">Country</th><th scope="col">Activated invites</th><th scope="col">All invites</th></tr></thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="5" class="zx-td-empty">Loading leaderboard...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</main>
</body>
</html>
