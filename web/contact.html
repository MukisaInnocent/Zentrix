<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="contact">
<main>
<div class="ph"><h1>Contact us</h1><p>We’re here to help.</p></div>
<div class="grid g2" style="max-width:900px">
  <div class="card"><h3>Get in touch</h3><p class="sub">Reach the support team directly.</p>
    <p style="display:flex;gap:10px;align-items:center"><i data-i="mail"></i> support@example.com</p>
    <p style="display:flex;gap:10px;align-items:center"><i data-i="phone"></i> +256 700 000 000 (WhatsApp)</p></div>
  <form class="card" data-demo=""><h3>Send a message</h3>
    <label for="m1">Subject</label><input id="m1"><label for="m2">Message</label><textarea id="m2" rows="4"></textarea>
    <button class="btn full" type="submit"><i data-i="send"></i> Send message</button></form>
</div>
</main>
<script src="js/app.js"></script>
</body></html>
