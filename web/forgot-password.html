<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · Pexerearn</title>
<meta name="description" content="Get a link to choose a new Pexerearn password.">
<meta name="theme-color" content="#5b2bd6">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme-init.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body data-page="forgot-password" data-shell="plain">
<div class="zx-auth-layout">
  <div class="zx-auth-panel">
    <div class="zx-auth-card">
      <a href="/" class="zx-brand"><img src="/img/mark.svg" alt=""><span class="zx-wordmark"><span class="zx-wordmark__pexer">Pexer</span><span class="zx-wordmark__earn">earn</span></span></a>
      <h1 data-i18n="forgot.title">Reset your password</h1>
      <p class="zx-lead" data-i18n="forgot.lead">Enter the email address on your account and we'll send a reset link.</p>

      <form id="forgot-form" class="zx-form" novalidate>
        <div class="zx-error" data-form-error hidden role="alert"></div>
        <div class="zx-field">
          <label for="forgot-email" data-i18n="forgot.email">Email address</label>
          <input id="forgot-email" class="zx-input" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
          <span id="forgot-email-error" class="zx-error" hidden></span>
        </div>
        <button class="zx-btn zx-btn--block zx-btn--lg" type="submit" data-i18n="forgot.submit">Send reset link</button>
      </form>

      <div id="forgot-sent" class="zx-banner zx-banner--success" hidden role="status"><svg class="zx-icon" aria-hidden="true"><use href="/img/icons.svg#mail"></use></svg><span class="zx-banner__text" data-i18n="forgot.sent">If an account uses that email, a reset link is on its way. It expires in 30 minutes.</span></div>

      <p class="zx-auth-switch"><a href="/login.html" data-i18n="forgot.back">Back to sign in</a></p>
    </div>
  </div>
</div>
</body>
</html>
