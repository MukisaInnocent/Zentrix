<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="profile">
<main>
<div class="ph"><h1>Profile</h1><p>Manage your personal information.</p></div>
<form class="card" data-demo="" style="max-width:760px"><h3>Personal information</h3>
  <div class="row2"><div><label for="a">Username</label><input id="a" value="demo_user"></div><div><label for="b">Email address</label><input id="b" type="email" value="demo@example.com"></div>
  <div><label for="c">Phone</label><input id="c" value="256700000000"></div><div><label for="d">Referred by</label><input id="d" value="sample_upline" readonly></div>
  <div><label for="e">New password</label><input id="e" type="password" placeholder="Change password"></div><div><label for="f">Confirm password</label><input id="f" type="password" placeholder="Confirm password"></div></div>
  <button class="btn full" type="submit" style="width:auto">Update profile</button></form>
</main>
<script src="js/app.js"></script>
</body></html>
