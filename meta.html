<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta ADS · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="meta">
<main>
<div class="ph"><h1>Meta ADS</h1><p>Create and manage ad campaigns.</p></div>
<section data-tab="create" data-title="Create campaign"><form class="card mt narrow" data-demo=""><h3>New campaign</h3><p class="sub">Set up your ad in a few steps.</p><label for="f15">Campaign name</label><input id="f15" placeholder="e.g. October promo"><label for="f16">Objective</label><select id="f16"><option>Traffic</option><option>Engagement</option><option>Leads</option><option>Sales</option></select><label for="f17">Daily budget (UGX)</label><input id="f17" placeholder="e.g. 5000"><label for="f18">Duration</label><select id="f18"><option>3 days</option><option>7 days</option><option>14 days</option><option>30 days</option></select><button class="btn full" type="submit"><i data-i="megaphone"></i> Launch campaign</button></form></section><section data-tab="campaigns" data-title="My campaigns"><div class="card mt"><h3>Campaigns</h3><div class="tw"><table><thead><tr><th>Name</th><th>Objective</th><th>Budget</th><th>Reach</th><th>Status</th></tr></thead><tbody><tr><td>October promo</td><td>Traffic</td><td>UGX 5,000/day</td><td>12,400</td><td><span class="badge">Active</span></td></tr><tr><td>Brand awareness</td><td>Engagement</td><td>UGX 3,000/day</td><td>8,150</td><td><span class="badge w">Paused</span></td></tr></tbody></table></div></div></section>
</main>
<script src="js/app.js"></script>
</body></html>
