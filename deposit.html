<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="deposit">
<main>
<div class="ph"><h1>Deposit</h1><p>Add funds to your account.</p></div>
<div class="grid g2"><div class="card stat"><i data-i="wallet"></i><small>Available balance</small><b data-money="availableBalance">UGX 0</b><small>Withdrawable wallet funds</small></div><div class="card stat"><i data-i="down"></i><small>Completed deposits</small><b data-money="totalDeposited">UGX 0</b><small>All time</small></div></div><form class="card mt narrow" data-wallet-form="deposits"><h3>Make a deposit</h3><p class="sub">Mock requests remain pending; no payment will be sent and no funds will be credited.</p><label for="f5">Amount (UGX)</label><input id="f5" name="amount" type="number" min="1" step="1" placeholder="e.g. 10000" required><label for="f6">Method</label><select id="f6" name="method"><option value="mobile_money">Mobile money</option><option value="bank_transfer">Bank transfer</option></select><label for="f7">Phone or account number</label><input id="f7" name="destination" placeholder="2567XXXXXXXX" minlength="5" maxlength="100" required><button class="btn full" type="submit"><i data-i="down"></i> Record deposit request</button><p data-api-message role="status" aria-live="polite"></p></form><div class="card mt"><h3>Deposit history</h3><div class="tw"><table><thead><tr><th>Date</th><th>Reference</th><th>Amount</th><th>Status</th></tr></thead><tbody data-transactions></tbody></table></div></div>
</main>
<script src="js/app.js"></script>
</body></html>
