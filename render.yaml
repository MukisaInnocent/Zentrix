databases:
  - name: zentrix-db
    databaseName: zentrix
    user: zentrix
    plan: basic-256mb

services:
  - type: web
    name: zentrix
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zentrix-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DEMO_PAYMENTS_ENABLED
        value: "false"
