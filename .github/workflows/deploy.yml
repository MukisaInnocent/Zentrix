# Pexa deploy pipeline (docs/DEPLOYMENT.md). Production only (owner, 2026-11-13: staging removed).
#   Run workflow (manual) -> checks, then the production job waits for a reviewer to approve it in GitHub (the
#   production environment's required-reviewers rule) when PEXA_PRODUCTION_ENABLED = true.
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  production:
    needs: checks
    if: vars.PEXA_PRODUCTION_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
