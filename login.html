<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Zentrix</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login">
<div class="auth">
  <div class="art"><h2>Manage your wallet, network and learning in one place.</h2><p>A clean member portal demo. Replace this panel with your own brand message or illustration.</p></div>
  <form data-demo="dashboard.html">
    <a class="logo" href="login.html"><span class="mark"></span>Zentrix</a>
    <h1>Sign in</h1><p style="color:var(--muted);margin:0">Welcome back. Log in to your account.</p>
    <label for="u">Username or email</label><input id="u" value="demo_user" autocomplete="username">
    <div class="between" style="margin-top:12px"><label for="p">Password</label><a href="#">Forgot password?</a></div>
    <div class="pw"><input id="p" type="password" value="demo1234" autocomplete="current-password"><button type="button" data-toggle="p" aria-label="Show password"><i data-i="eye"></i></button></div>
    <button class="btn full" type="submit">Sign in</button>
    <p style="text-align:center;color:var(--muted);font-size:14px;margin-top:20px">Don’t have an account? <a href="#">Sign up</a></p>
  </form>
</div>
<script src="js/app.js"></script>
</body></html>
